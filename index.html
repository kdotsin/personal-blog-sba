<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-stone-100">
    <main class="flex flex-col gap-15">
        <header class="flex justify-between items-center h-25 bg-white">
            <div class="flex justify-between items-center mx-20 w-full">
                <h1 class="text-xl font-bold">Richard's Blog</h1>
                <button type="submit" form="blog-form" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-lg shadow-md hover:shadow-indigo-500/25 active:scale-95 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 w-25">Post</button>
            </div>
        </header>
        <section class="mx-40 bg-white">
            <form class="flex flex-col mb-10" id="blog-form" novalidate>
                <div class="flex flex-col text-4xl gap-4 mx-10 mt-10">
                    <label class="" for="post-title">Title</label>
                    <input class="text-3xl" type="text" name="post-title" id="post-title" minlength="3" required>
                    <span class="mt-1 block text-xs font-medium text-red-600" id="title-error"></span>
                </div>
                <div class="flex flex-col text-4xl gap-4 mx-10 mt-10">
                    <label class="" for="post-content">Content</label>
                    <textarea class="text-lg h-30" name="post-content" id="post-content" minlength="10" required></textarea>
                    <span class="mt-1 block text-xs font-medium text-red-600" id="content-error"></span>
                </div>
            </form>
        </section>
        <section class="flex flex-col h-screen mx-20 bg-white">
            <ul class="mx-20 mt-10" id="blog-content">
            </ul>
        </section>
    </main>
</body>
</html>
